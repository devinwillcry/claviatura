<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..800,0..100,0..1&family=IBM+Plex+Mono:wght@500;600&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Conceito: um acervo de discos com jeito de caderno de brinquedo. Logo no centro,
   formas redondas, linhas onduladas, discos de vinil saindo das capas. A leitura segue clara:
   contraste alto, fundo calmo, textos em fonte arredondada.
   A página recebe o matiz da capa aberta (--h, --sn, --as). */
:root{
  color-scheme:light;
  --h:250; --sn:30; --as:52;
  --display:Fraunces,Georgia,serif;
  --dvar:"SOFT" 100,"WONK" 1;
  --body:Nunito,Inter,system-ui,sans-serif;
  --cover:170px;
  --bg:hsl(var(--h) calc(var(--sn) * .55%) 95.5%);
  --surface:hsl(var(--h) calc(var(--sn) * .45%) 99%);
  --fg:hsl(var(--h) 26% 14%);
  --muted:hsl(var(--h) 12% 37%);
  --line:hsl(var(--h) calc(var(--sn) * .55%) 85%);
  --accent:hsl(var(--h) calc(var(--as) * 1%) 38%);
  --accent-ink:#fff;
  --hl:38%;
  --wash:hsl(var(--h) calc(var(--as) * 1%) 58% / .26);
  --dot:hsl(var(--h) calc(var(--sn) * 1%) 45% / .17);
  --btn-shadow:hsl(var(--h) calc(var(--as) * 1%) 22%);
  --ring:hsl(var(--h) 30% 30% / .25);
  --star-off:hsl(var(--h) 14% 45% / .24);
  --danger:hsl(2 55% 42%);
  --shadow:hsl(var(--h) 30% 20% / .45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) calc(var(--sn) * .5%) 10.5%);
    --surface:hsl(var(--h) calc(var(--sn) * .45%) 14.5%);
    --fg:hsl(var(--h) 16% 93%);
    --muted:hsl(var(--h) 10% 68%);
    --line:hsl(var(--h) calc(var(--sn) * .45%) 24%);
    --accent:hsl(var(--h) calc(var(--as) * 1%) 66%);
    --accent-ink:hsl(var(--h) 30% 9%);--hl:66%;
    --wash:hsl(var(--h) calc(var(--as) * 1%) 45% / .36);
    --dot:hsl(var(--h) calc(var(--sn) * 1%) 75% / .12);
    --btn-shadow:hsl(var(--h) calc(var(--as) * 1%) 32%);
    --ring:hsl(0 0% 100% / .3);
    --star-off:hsl(var(--h) 14% 70% / .22);
    --danger:hsl(2 70% 72%);
    --shadow:hsl(0 0% 0% / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) calc(var(--sn) * .5%) 10.5%);
  --surface:hsl(var(--h) calc(var(--sn) * .45%) 14.5%);
  --fg:hsl(var(--h) 16% 93%);
  --muted:hsl(var(--h) 10% 68%);
  --line:hsl(var(--h) calc(var(--sn) * .45%) 24%);
  --accent:hsl(var(--h) calc(var(--as) * 1%) 66%);
  --accent-ink:hsl(var(--h) 30% 9%);--hl:66%;
  --wash:hsl(var(--h) calc(var(--as) * 1%) 45% / .36);
  --dot:hsl(var(--h) calc(var(--sn) * 1%) 75% / .12);
  --btn-shadow:hsl(var(--h) calc(var(--as) * 1%) 32%);
  --ring:hsl(0 0% 100% / .3);
  --star-off:hsl(var(--h) 14% 70% / .22);
  --danger:hsl(2 70% 72%);
  --shadow:hsl(0 0% 0% / .6);
  color-scheme:dark;
}
:root[data-font="grotesk"]{--display:"Space Grotesk",system-ui,sans-serif;--dvar:normal}
:root[data-font="mono"]{--display:"IBM Plex Mono",ui-monospace,monospace;--dvar:normal}

*{box-sizing:border-box}
html{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.8px);
  background-size:26px 26px;
  transition:background-color .4s ease;
}
body{
  margin:0;color:var(--fg);
  font:16px/1.55 var(--body);
  min-height:100vh;
  padding-block:8px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:color .4s ease;
}
body::before{

<script>
(function(){

var S={q:"",min:0,decade:""};
var lastFocus=null,toastTimer=null,coverOk=new Map();

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var norm=function(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()};
var fmt=function(n){return Number(n).toFixed(1).replace(".",",")};
var clamp=function(v,lo,hi){return Math.max(lo,Math.min(hi,v))};
var newId=function(){return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dlabel(s){if(!s)return "";var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"})}
function hashHue(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0}return h%360}
function initials(t){var w=String(t).trim().split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase()}

function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},4200)}
function errMsg(e){
  if(e&&e.code==="local_full")return "O navegador não tem espaço para salvar. Exporte um backup e libere espaço.";
  return "Não foi possível salvar agora. Tente novamente.";
}

/* ---------- armazenamento local (IndexedDB) ---------- */
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error("sem IndexedDB"));return}
    var rq=indexedDB.open("discoteca",1);
    rq.onupgradeneeded=function(){var d=rq.result;d.createObjectStore("albums",{keyPath:"id"});d.createObjectStore("kv",{keyPath:"k"})};
    rq.onsuccess=function(){res(rq.result)};
    rq.onerror=function(){rej(rq.error)};
  });
}
function idbReq(store,mode,fn){
  return new Promise(function(res,rej){
    var tx=idb.transaction(store,mode),r=fn(tx.objectStore(store));
    tx.oncomplete=function(){res(r&&r.result)};
    tx.onerror=tx.onabort=function(){rej(tx.error||{code:"local_full"})};
  });
}
function putMany(list){
  var apply=function(){
    list.forEach(function(a){var i=albums.findIndex(function(x){return x.id===a.id});if(i>=0)albums[i]=a;else albums.push(a)});
    render();
  };
  if(!idb){apply();return Promise.resolve()}
  return idbReq("albums","readwrite",function(s){list.forEach(function(a){s.put(a)})}).then(apply,function(){return Promise.reject({code:"local_full"})});
}
function persistAlbum(a){return putMany([a])}
function removeAlbum(id){
  var apply=function(){albums=albums.filter(function(x){return x.id!==id});render()};
  if(!idb){apply();return Promise.resolve()}
  return idbReq("albums","readwrite",function(s){s.delete(id)}).then(apply,function(){return Promise.reject({code:"local_full"})});
}
function persistCfg(){
  if(!idb)return Promise.resolve();
  return idbReq("kv","readwrite",function(s){s.put({k:"cfg",v:cfg})}).catch(function(){return Promise.reject({code:"local_full"})});
}

/* ---------- dados ---------- */
function okCover(id,c){
  if(typeof c!=="string"||c.indexOf("data:image/")!==0)return false;
  var k=coverOk.get(id);
  if(k&&k.len===c.length)return k.ok;
  var ok=/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(c);
  coverOk.set(id,{len:c.length,ok:ok});
  return ok;
}
function numIn(x,lo,hi){x=Number(x);return isFinite(x)&&x>=lo&&x<=hi?x:null}
function normStar(o){
  if(!o||typeof o!=="object")return null;
  var h=numIn(o.h,0,360),s=numIn(o.s,0,100);
  if(h==null||s==null)return null;
  var l=numIn(o.l,0,100);
  return {h:h,s:s,l:l==null?56:l};
}
function normAlbum(id,d){
  d=d||{};
  /* notas antigas (0 a 10) viram estrelas (0 a 5, em meias) */
  var st=d.stars!=null?numIn(d.stars,0,5):null;
  if(st==null){var old=numIn(d.score,0,10);st=old==null?0:Math.round(old)/2}
  st=Math.round(st*2)/2;
  return {
    id:id,
    title:String(d.title||"Sem título"),
    artist:String(d.artist||"Artista desconhecido"),
    year:d.year==null?null:numIn(d.year,1900,2100),
    genres:Array.isArray(d.genres)?d.genres.map(String).slice(0,8):[],
    stars:st,
    review:String(d.review||""),
    favorites:String(d.favorites||""),
    listenedAt:/^\d{4}-\d{2}-\d{2}$/.test(d.listenedAt||"")?d.listenedAt:"",
    cover:okCover(id,d.cover)?d.cover:null,
    h:d.h==null?null:numIn(d.h,0,360),
    sn:d.sn==null?null:numIn(d.sn,0,100),
    as:d.as==null?null:numIn(d.as,0,100),
    sc:normStar(d.sc),
    scm:normStar(d.scm),
    createdAt:Number(d.createdAt)||0,
    updatedAt:Number(d.updatedAt)||0
  };
}

/* ---------- aparência ---------- */
function applyConfig(){
  var r=document.documentElement,name=cfg.name||DEFAULTS.name;
  if(cfg.theme==="light"||cfg.theme==="dark")r.setAttribute("data-theme",cfg.theme);
  else r.removeAttribute("data-theme");
  r.setAttribute("data-font",cfg.font);
  r.style.setProperty("--cover",(SIZES[cfg.size]||170)+"px");
  $("#brandName").textContent=name;
  $("#brand").setAttribute("aria-label",name);
  document.title=name;
  resetTint();
}
function setWash(){document.body.setAttribute("data-wash",(view==="album"||cfg.accent==="fixed")?"on":"soft")}
function resetTint(){
  var s=document.documentElement.style;
  if(cfg.accent==="fixed"&&cfg.custom){
    s.setProperty("--h",cfg.custom.h);
    s.setProperty("--sn",clamp(Math.round(cfg.custom.s*.4),6,40));
    s.setProperty("--as",cfg.custom.s);
  }else{
    s.setProperty("--h",250);s.setProperty("--sn",30);s.setProperty("--as",52);
  }
  setWash();
}
function paletteOf(a){
  return {
    h:a.h!=null?a.h:hashHue(a.title+a.artist),
    sn:a.sn!=null?a.sn:26,
    as:a.as!=null?a.as:55
  };
}
function tintFor(a){
  if(cfg.accent==="fixed")return;
  var p=paletteOf(a),s=document.documentElement.style;
  s.setProperty("--h",p.h);s.setProperty("--sn",p.sn);s.setProperty("--as",p.as);
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h*=60;
  }
  return [h,s,l];
}
/* cor de destaque da capa: matiz dominante entre os pixels vivos */
function paletteFromCanvas(canvas){
  var n=32,c=document.createElement("canvas");c.width=c.height=n;
  var x=c.getContext("2d",{willReadFrequently:true});x.drawImage(canvas,0,0,n,n);
  var px=x.getImageData(0,0,n,n).data,B=12,acc=[];
  for(var k=0;k<B;k++)acc.push({w:0,x:0,y:0,s:0,l:0});
  for(var i=0;i<px.length;i+=4){
    var t=rgb2hsl(px[i],px[i+1],px[i+2]),h=t[0],sat=t[1],l=t[2];
    if(l<.14||l>.9||sat<.16)continue;
    var w=sat*(1-Math.abs(2*l-1)),b=Math.min(B-1,Math.floor(h/360*B)),rad=h*Math.PI/180,q=acc[b];
    q.w+=w;q.x+=Math.cos(rad)*w;q.y+=Math.sin(rad)*w;q.s+=sat*w;q.l+=l*w;
  }
  var best=acc[0];
  acc.forEach(function(q){if(q.w>best.w)best=q});
  if(best.w<1.5)return {h:220,sn:12,as:16,sc:null};
  var hue=Math.round(((Math.atan2(best.y,best.x)*180/Math.PI)+360)%360);
  var sat2=best.s/best.w*100,lum=best.l/best.w*100;
  return {
    h:hue,
    sn:Math.round(clamp(sat2*.55,20,42)),
    as:Math.round(clamp(sat2,55,90)),
    sc:{h:hue,s:Math.round(clamp(sat2,62,95)),l:Math.round(clamp(lum,48,60))}
  };
}
function readImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function processCover(file){
  return readImage(file).then(function(img){
    var S2=360,c=document.createElement("canvas");c.width=c.height=S2;
    var ctx=c.getContext("2d"),m=Math.min(img.naturalWidth,img.naturalHeight);
    ctx.fillStyle="#222";ctx.fillRect(0,0,S2,S2);
    ctx.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S2,S2);
    var pal=paletteFromCanvas(c);
    return {cover:c.toDataURL("image/jpeg",.8),h:pal.h,sn:pal.sn,as:pal.as,sc:pal.sc};
  });
}
function paletteOfSrc(src){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){var c=document.createElement("canvas");c.width=c.height=64;c.getContext("2d").drawImage(im,0,0,64,64);res(paletteFromCanvas(c))};
    im.onerror=function(){res(null)};
    im.src=src;
  });
}
/* álbuns salvos antes da cor de destaque: calcula uma vez */
async function upgradePalettes(){
  var todo=albums.filter(function(a){return a.cover&&a.as==null});
  if(!todo.length)return;
  var out=[];
  for(var i=0;i<todo.length;i++){
    var p=await paletteOfSrc(todo[i].cover);
    out.push(Object.assign({},todo[i],p?{h:p.h,sn:p.sn,as:p.as,sc:p.sc}:{as:50}));
  }
  putMany(out).catch(function(){});
}

function adj(c){return {h:c.h,s:clamp(Math.round(c.s*cfg.sInt/100),0,100),l:clamp(Math.round(c.l+cfg.sLit),20,85)}}

/* ---------- seletor de cor (roda + tabela) ---------- */
function hsl2rgb(h,s,l){
  s/=100;l/=100;
  var a=s*Math.min(l,1-l);
  var f=function(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)))};
  return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))];
}
var wheelCache=null;
function wheelCanvas(){
  if(wheelCache)return wheelCache;
  var n=220,R=n/2,c=document.createElement("canvas");c.width=c.height=n;
  var x=c.getContext("2d"),id=x.createImageData(n,n);
  for(var py=0;py<n;py++)for(var px=0;px<n;px++){
    var dx=px+.5-R,dy=py+.5-R,r=Math.sqrt(dx*dx+dy*dy),i=(py*n+px)*4;
    if(r>R)continue;
    var h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,rgb=hsl2rgb(h,r/R*100,88-38*(r/R));
    id.data[i]=rgb[0];id.data[i+1]=rgb[1];id.data[i+2]=rgb[2];
    id.data[i+3]=r>R-1?Math.round(255*(R-r)):255;
  }
  x.putImageData(id,0,0);
  wheelCache=c;return c;
}
function buildPicker(host,val,cb){
  var cur={h:val.h,s:val.s};
  host.innerHTML='<div class="cpick"><div class="wheelwrap"><canvas width="220" height="220"></canvas><span class="wdot"></span></div>'+
    '<div class="swatches">'+PALETTE.map(function(p,i){return '<button type="button" class="sw" data-h="'+p[0]+'" data-s="'+p[1]+'" aria-label="Cor '+(i+1)+'" aria-pressed="false" style="background:hsl('+p[0]+' '+p[1]+'% 50%)"></button>'}).join("")+'</div></div>';
  var cv=host.querySelector("canvas"),dot=host.querySelector(".wdot"),ww=host.querySelector(".wheelwrap");
  cv.getContext("2d").drawImage(wheelCanvas(),0,0);
  function place(){
    var r=cur.s/100*50,a=cur.h*Math.PI/180;
    dot.style.left=(50+Math.cos(a)*r)+"%";dot.style.top=(50+Math.sin(a)*r)+"%";
    dot.style.background="hsl("+cur.h+" "+cur.s+"% 50%)";
    host.querySelectorAll(".sw").forEach(function(b){b.setAttribute("aria-pressed",String(Number(b.dataset.h)===cur.h&&Number(b.dataset.s)===cur.s))});
  }
  function fromEvent(e,final){
    var b=ww.getBoundingClientRect(),R=b.width/2,dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);
    var r=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1);
    cur={h:Math.round((Math.atan2(dy,dx)*180/Math.PI+360)%360)%360,s:Math.round(r*100)};
    place();cb(cur,final);
  }
  var drag=false;
  ww.addEventListener("pointerdown",function(e){drag=true;try{ww.setPointerCapture(e.pointerId)}catch(x){}fromEvent(e,false)});
  ww.addEventListener("pointermove",function(e){if(drag)fromEvent(e,false)});
  ww.addEventListener("pointerup",function(e){if(!drag)return;drag=false;fromEvent(e,true)});
  ww.addEventListener("pointercancel",function(){drag=false});
  host.querySelector(".swatches").addEventListener("click",function(e){
    var b=e.target.closest(".sw");if(!b)return;
    cur={h:Number(b.dataset.h),s:Number(b.dataset.s)};place();cb(cur,true);
  });
  place();
  return {set:function(v){cur={h:v.h,s:v.s};place()}};
}

/* ---------- MusicBrainz: só álbuns (inclui deluxe e reedições) ---------- */
var SKIP2={"Compilation":1,"DJ-mix":1,"Mixtape/Street":1,"Demo":1,"Interview":1,"Audiobook":1,"Spokenword":1,"Audio drama":1};
var SEC_PT={"Live":"Ao vivo","Soundtrack":"Trilha sonora","Remix":"Remix"};
/* palavras separadas por AND; a última vira prefixo (ok comp* acha "OK Computer") */
function termQ(s){
  var w=String(s||"").normalize("NFC").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  if(!w.length)return "";
  return "("+w.map(function(x,i){return (i===w.length-1&&x.length>=2)?x+"*":x}).join(" AND ")+")";
}
function searchMB(t,ar,signal){
  var parts=[],tq=termQ(t),aq=termQ(ar);
  if(tq)parts.push("releasegroup:"+tq);
  if(aq)parts.push("artist:"+aq);
  parts.push("primarytype:album");
  var url="https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=25&query="+encodeURIComponent(parts.join(" AND "));
  return fetch(url,{signal:signal}).then(function(r){
    if(r.status===503||r.status===429)throw new Error("O MusicBrainz está ocupado. Continue digitando que a busca tenta de novo.");
    if(!r.ok)throw new Error("O MusicBrainz não respondeu. Preencha manualmente.");
    return r.json();
  },function(err){
    if(err&&err.name==="AbortError")throw err;
    throw new Error("Sem conexão com o MusicBrainz. Preencha manualmente.");
  }).then(function(d){
    return (d["release-groups"]||[]).filter(function(g){
      if(!/^[0-9a-f-]{36}$/.test(g.id))return false;
      if(g["primary-type"]!=="Album")return false;
      return !(g["secondary-types"]||[]).some(function(x){return SKIP2[x]});
    }).slice(0,8).map(function(g){
      var sec=(g["secondary-types"]||[]).map(function(x){return SEC_PT[x]||x});
      return {
        id:g.id,title:String(g.title||""),
        artist:(g["artist-credit"]||[]).map(function(c){return (c.name||(c.artist&&c.artist.name)||"")+(c.joinphrase||"")}).join("").trim(),
        year:(g["first-release-date"]||"").slice(0,4),
        extra:sec.join(", ")
      };
    });
  });
}
function fetchCover(id){
  return fetch("https://coverartarchive.org/release-group/"+id+"/front-500").then(function(r){
    if(!r.ok)throw new Error("sem capa");
    return r.blob();
  }).then(processCover);
}

var SORTS={
  recent:function(a,b){return (b.listenedAt||"").localeCompare(a.listenedAt||"")||(b.createdAt-a.createdAt)},
  score:function(a,b){return b.stars-a.stars||a.title.localeCompare(b.title,"pt-BR")},
  artist:function(a,b){return a.artist.localeCompare(b.artist,"pt-BR")||((a.year||0)-(b.year||0))},
  year:function(a,b){return (b.year||0)-(a.year||0)||a.title.localeCompare(b.title,"pt-BR")}
};
function renderAcervo(){

/* pesquisa */
function searchShell(){
  return '<section class="search"><label class="sr" for="q">Pesquisar</label>'+
    '<input id="q" type="search" placeholder="Álbum, artista, ano ou trecho da resenha" autocomplete="off">'+

    '<p id="rcount" class="count"></p><div id="results" class="results"></div></section>';

function updateFilters(){
  var decs=Array.from(new Set(albums.filter(function(a){return a.year}).map(function(a){return Math.floor(a.year/10)*10}))).sort(function(a,b){return b-a});
  var sel=$("#decade");
  sel.innerHTML='<option value="">Todas</option>'+decs.map(function(d){return '<option value="'+d+'">'+d+'s</option>'}).join("");
  sel.value=decs.indexOf(Number(S.decade))>=0?S.decade:"";S.decade=sel.value;
}
function filtered(){
  var terms=norm(S.q.trim()).split(/\s+/).filter(Boolean);
  return albums.filter(function(a){
    if(a.stars<S.min)return false;
    if(S.decade&&!(a.year&&Math.floor(a.year/10)*10===Number(S.decade)))return false;
    if(terms.length){
      var hay=norm([a.title,a.artist,a.year||"",a.review,a.favorites].join(" "));
      return terms.every(function(t){return hay.indexOf(t)>=0});
    }
    return true;
  }).sort(SORTS.score);
}
function updateResults(){
  var list=filtered();
  $("#minv").textContent=fmt(S.min);
  $("#rcount").textContent=list.length+(list.length===1?" resultado":" resultados");
  $("#results").innerHTML=list.map(function(a){
    return '<a class="rc" href="#album-'+a.id+'"><div class="cover">'+coverHTML(a)+'</div><div class="rc-main"><strong>'+esc(a.title)+'</strong><span>'+esc(a.artist)+(a.year?" · "+a.year:"")+'</span></div>'+starsHTML(a.stars,a)+'</a>';
  }).join("")||'<p class="note" style="margin:16px 10px">Nenhum álbum encontrado com esses filtros.</p>';
}
function refreshPages(){
  if(view==="album"||view==="acervo")render();
  else if(view==="pesquisar"&&$("#results"))updateResults();
}

/* ---------- navegação e render ---------- */
function route(){
  var h=location.hash.slice(1)||"acervo";
  if(h==="pesquisar"){view="pesquisar"}
  else if(h.indexOf("album-")===0){view="album";albumId=h.slice(6)}
  else view="acervo";
  render();window.scrollTo(0,0);
}
function render(){
  var tab=view==="album"?"acervo":view;
  document.querySelectorAll("[data-tab]").forEach(function(a){
    if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  var el=$("#view");
  if(view==="acervo"){resetTint();el.innerHTML=renderAcervo()}
  else if(view==="album"){el.innerHTML=renderAlbum()}
  else{
    resetTint();
    var n=stateNote();
    if(n||!albums.length){el.innerHTML=n||emptyHTML()}
    else{
      if(!$("#q")){el.innerHTML=searchShell();$("#q").value=S.q;$("#min").value=S.min}
      updateFilters();updateResults();
    }
  }
  setWash();
}

    }
    var dragging=false;
    pk.addEventListener("pointerdown",function(e){dragging=true;try{pk.setPointerCapture(e.pointerId)}catch(x){}fromPtr(e)});
    pk.addEventListener("pointermove",function(e){if(dragging)fromPtr(e)});
    pk.addEventListener("pointerup",function(){dragging=false});
    pk.addEventListener("pointercancel",function(){dragging=false});
    pk.addEventListener("keydown",function(e){
      var k=e.key;
      if(k==="ArrowRight"||k==="ArrowUp")setRating(rating+.5);
      else if(k==="ArrowLeft"||k==="ArrowDown")setRating(rating-.5);
      else if(k==="Home")setRating(0);
      else if(k==="End")setRating(5);
      else return;
      e.preventDefault();
    });

    /* cor, intensidade e brilho das estrelas deste álbum */
    var scPick=q("#scPick"),bAuto=q("#scAuto"),bCustom=q("#scCustom"),satI=q("#f-sat"),litI=q("#f-lit"),picker=null;
    function syncSliders(){
      var c=curColor();
      satI.value=c.s;litI.value=c.l;
      q("#f-satv").textContent=c.s+"%";q("#f-litv").textContent=c.l+"%";
    }
    function enterCustom(){
      if(!st.scm){var c=curColor();st.scm={h:c.h,s:c.s,l:c.l}}
      bAuto.setAttribute("aria-pressed","false");bCustom.setAttribute("aria-pressed","true");
      scPick.hidden=false;
      picker=buildPicker(scPick,st.scm,function(v){st.scm.h=v.h;st.scm.s=v.s;paintColor();syncSliders()});
    }
    function leaveCustom(){
      st.scm=null;picker=null;scPick.hidden=true;scPick.innerHTML="";
      bAuto.setAttribute("aria-pressed","true");bCustom.setAttribute("aria-pressed","false");
      paintColor();syncSliders();
    }
    bAuto.addEventListener("click",leaveCustom);
    bCustom.addEventListener("click",function(){if(!st.scm){enterCustom();paintColor();syncSliders()}});
    function onSlider(){
      if(!st.scm)enterCustom();
      st.scm.s=Number(satI.value);st.scm.l=Number(litI.value);
      if(picker)picker.set(st.scm);
      q("#f-satv").textContent=st.scm.s+"%";q("#f-litv").textContent=st.scm.l+"%";
      paintColor();
    }
    satI.addEventListener("input",onSlider);litI.addEventListener("input",onSlider);
    if(st.scm)enterCustom();
    paintColor();syncSliders();setRating(rating);drawCover();

    /* sugestões do MusicBrainz enquanto digita (só ao adicionar) */
    var box=q("#mbbox");
    if(box){
      var stat=q("#mbstat"),res=q("#mbres"),mbList=[],acTimer=null,acReq=0,acCtl=null;
      var acHide=function(){box.hidden=true;res.innerHTML="";stat.textContent=""};
      var acRun=function(){
        var t=q("#f-title").value.trim(),ar=q("#f-artist").value.trim();
        if(t.length<2&&ar.length<3){acHide();return}
        var id=++acReq;if(acCtl)acCtl.abort();acCtl=new AbortController();
        box.hidden=false;stat.textContent="Buscando no MusicBrainz…";
        searchMB(t,ar,acCtl.signal).then(function(list){
          if(id!==acReq)return;
          mbList=list;
          stat.textContent=list.length?"Escolha um álbum para preencher tudo de uma vez:":"Nenhum álbum encontrado. Continue digitando ou preencha manualmente.";
          res.innerHTML=list.map(function(r,i){
            return '<button type="button" class="mbrow" role="option" data-i="'+i+'"><img src="https://coverartarchive.org/release-group/'+r.id+'/front-250" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'+
              '<div><strong>'+esc(r.title)+'</strong><span>'+esc(r.artist)+(r.year?" · "+r.year:"")+(r.extra?" · "+esc(r.extra):"")+'</span></div></button>';
          }).join("");
        }).catch(function(e){
          if(id!==acReq||(e&&e.name==="AbortError"))return;
          stat.textContent=(e&&e.message)||"Não foi possível buscar agora.";res.innerHTML="";
        });
      };
      var acSchedule=function(){clearTimeout(acTimer);acTimer=setTimeout(acRun,500)};
      q("#f-title").addEventListener("input",acSchedule);
      q("#f-artist").addEventListener("input",acSchedule);
      ["#f-title","#f-artist"].forEach(function(sel){
        q(sel).addEventListener("keydown",function(e){
          if(e.key==="ArrowDown"&&!box.hidden){var f=res.querySelector(".mbrow");if(f){e.preventDefault();f.focus()}}
          else if(e.key==="Escape"&&!box.hidden){e.stopPropagation();acHide()}
        });
      });
      res.addEventListener("keydown",function(e){
        var rows=Array.from(res.querySelectorAll(".mbrow")),i=rows.indexOf(document.activeElement);
        if(e.key==="ArrowDown"){e.preventDefault();if(rows[i+1])rows[i+1].focus()}
        else if(e.key==="ArrowUp"){e.preventDefault();if(i>0)rows[i-1].focus();else q("#f-title").focus()}
        else if(e.key==="Escape"){e.stopPropagation();acHide();q("#f-title").focus()}
      });
      res.addEventListener("click",function(e){
        var b=e.target.closest(".mbrow");if(!b)return;
        var r=mbList[Number(b.dataset.i)];if(!r)return;
        acReq++;if(acCtl)acCtl.abort();clearTimeout(acTimer);
        q("#f-title").value=r.title;q("#f-artist").value=r.artist;
        if(r.year)q("#f-year").value=r.year;
        res.innerHTML="";stat.textContent="Baixando a capa…";q("#ferr").textContent="";
        fetchCover(r.id).then(function(x){applyCover(x);acHide()}).catch(function(){
          stat.textContent="Não encontrei a capa desse álbum. Escolha uma imagem do seu computador.";
        });
      });
    }

    q("#albumForm").addEventListener("submit",function(e){
      e.preventDefault();
      var title=q("#f-title").value.trim(),artist=q("#f-artist").value.trim(),err=q("#ferr");
      if(!title||!artist){err.textContent="Informe o título e o artista.";return}
      var ys=q("#f-year").value.trim(),year=null;
      if(ys){year=Number(ys);if(!/^\d{4}$/.test(ys)||year<1900||year>yr){err.textContent="Use um ano com quatro dígitos, como 1997.";return}}
      var now=Date.now();
      var rec={id:a?a.id:newId(),title:title,artist:artist,year:year,genres:a?a.genres:[],stars:rating,
        review:q("#f-review").value.trim(),favorites:q("#f-fav").value.trim(),listenedAt:q("#f-date").value||"",
        cover:st.cover,h:st.h,sn:st.sn,as:st.as,sc:st.sc,scm:st.scm,createdAt:a?a.createdAt:now,updatedAt:now};
      var btn=q("button[type=submit]");btn.disabled=true;err.textContent="";
      persistAlbum(rec).then(function(){
        closePanel();toast("Álbum salvo.");
        if(!a)location.hash="album-"+rec.id;
      }).catch(function(e2){err.textContent=errMsg(e2);btn.disabled=false});
    });
  });
}

function openCfg(){
  var html='<h2>Personalizar</h2><div class="cfgblock"><label for="cfgName" style="margin-bottom:0">Nome do site</label><input id="cfgName" maxlength="40" autocomplete="off"></div><div id="cfgRest"></div>'+
    '<div class="cfgblock"><span>Backup das suas notas</span><div class="seg"><button type="button" data-act="export">Exportar</button><button type="button" data-act="import">Importar</button></div>'+
    '<p>O arquivo guarda todos os álbuns, notas e capas. Importar não apaga o que já está aqui.</p><input id="impFile" type="file" accept="application/json,.json" hidden></div>'+
    '<div class="btns"><button type="button" class="btn primary" data-act="close">Concluir</button></div>';
  openPanel(html,function(o){o.querySelector("#cfgName").value=cfg.name;fillCfg()});
}
function seg(k,items){
  return '<div class="seg">'+items.map(function(it){return '<button type="button" data-act="set" data-k="'+k+'" data-v="'+it[0]+'" aria-pressed="'+(String(cfg[k])===String(it[0]))+'">'+it[1]+'</button>'}).join("")+'</div>';
}
var SAMPLE={sc:{h:14,s:82,l:55}};
function litLabel(v){return (v>0?"+":"")+v}
function fillCfg(){
  var fixed=cfg.accent==="fixed";
  $("#cfgRest").innerHTML=
    '<div class="cfgblock"><span>Tema</span>'+seg("theme",[["system","Do sistema"],["light","Claro"],["dark","Escuro"]])+'</div>'+
    '<div class="cfgblock"><span>Fonte dos títulos</span>'+seg("font",[["whimsy","Divertida"],["grotesk","Moderna"],["mono","Monoespaçada"]])+'</div>'+
    '<div class="cfgblock"><span>Cor do site</span><div class="seg"><button type="button" data-act="set" data-k="accent" data-v="auto" aria-pressed="'+!fixed+'">Da capa</button><button type="button" data-act="set" data-k="accent" data-v="fixed" aria-pressed="'+fixed+'">Escolher cor</button></div><div id="sitePick" hidden></div></div>'+
    '<div class="cfgblock"><span>Estrelas</span>'+seg("stars",[["cover","Cor da capa"],["gold","Dourado"]])+
      '<div class="slrow"><label for="cfgInt" style="margin:0">Intensidade</label><input id="cfgInt" type="range" min="30" max="130" step="5"><b id="cfgIntV"></b></div>'+
      '<div class="slrow"><label for="cfgLit" style="margin:0">Brilho</label><input id="cfgLit" type="range" min="-20" max="20" step="1"><b id="cfgLitV"></b></div>'+
      '<div class="prev" id="starPrev"></div>'+
      '<p>Vale para as estrelas que seguem a capa ou o dourado. A cor escolhida em um álbum tem prioridade.</p></div>'+
    '<div class="cfgblock"><span>Tamanho das capas</span>'+seg("size",[["s","Pequeno"],["m","Médio"],["l","Grande"]])+'</div>';
  $("#cfgInt").value=cfg.sInt;$("#cfgLit").value=cfg.sLit;
  $("#cfgIntV").textContent=cfg.sInt+"%";$("#cfgLitV").textContent=litLabel(cfg.sLit);
  refreshStarPrev();
  if(fixed){
    var host=$("#sitePick");host.hidden=false;
    buildPicker(host,cfg.custom,function(v,final){
      cfg.custom={h:v.h,s:v.s};resetTint();
      if(final)persistCfg().catch(function(e){toast(errMsg(e))});
    });
  }
}
function refreshStarPrev(){var p=$("#starPrev");if(p)p.innerHTML=starsHTML(4.5,SAMPLE,"big")}
function setCfg(k,v){
  cfg[k]=v;
  if(k==="accent"&&v==="fixed"&&!cfg.custom)cfg.custom={h:250,s:55};
  applyConfig();
  refreshPages();
  if($("#cfgRest"))fillCfg();
  persistCfg().catch(function(e){toast(errMsg(e))});
}

/* ---------- backup ---------- */
function exportBackup(){
  var data={app:"claviatura",version:2,exportedAt:new Date().toISOString(),cfg:cfg,albums:albums};
  var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="claviatura-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},3000);
  toast("Backup exportado.");
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    var d;
    try{d=JSON.parse(fr.result);if(!d||!Array.isArray(d.albums))throw new Error("formato")}
    catch(e){toast("Esse arquivo não parece um backup deste site.");return}
    var list=d.albums.map(function(x){
      var id=String((x&&x.id)||"").replace(/[^A-Za-z0-9-]/g,"")||newId();
      return normAlbum(id,x);
    });
    putMany(list).then(function(){
      if(d.cfg){mergeCfg(d.cfg);applyConfig();persistCfg().catch(function(){})}
      toast(list.length+(list.length===1?" álbum importado.":" álbuns importados."));
      closePanel();
    }).catch(function(e){toast(errMsg(e))});
  };
  fr.onerror=function(){toast("Não foi possível ler o arquivo.")};
  fr.readAsText(file);
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  if(e.target.id==="overlay"){closePanel();return}
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.dataset.act;
  if(act==="add")openForm(null);
  else if(act==="edit"){var a=albums.find(function(x){return x.id===t.dataset.id});if(a)openForm(a)}
  else if(act==="del"){
    if(!t.dataset.armed){
      t.dataset.armed="1";t.textContent="Confirmar exclusão";
      setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent="Excluir"}},4000);
    }else{
      removeAlbum(t.dataset.id).then(function(){location.hash="acervo";toast("Álbum excluído.")}).catch(function(er){toast(errMsg(er))});
    }
  }
  else if(act==="close")closePanel();
  else if(act==="cfg")openCfg();
  else if(act==="set")setCfg(t.dataset.k,t.dataset.v);
  else if(act==="export")exportBackup();
  else if(act==="import")$("#impFile").click();
});
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="q"){S.q=e.target.value;updateResults()}
  else if(id==="min"){S.min=Number(e.target.value);updateResults()}
  else if(id==="cfgInt"||id==="cfgLit"){
    if(id==="cfgInt")cfg.sInt=Number(e.target.value);else cfg.sLit=Number(e.target.value);
    $("#cfgIntV").textContent=cfg.sInt+"%";$("#cfgLitV").textContent=litLabel(cfg.sLit);
    refreshStarPrev();refreshPages();
  }
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="sort"){sortKey=e.target.value;render()}
  else if(id==="decade"){S.decade=e.target.value;updateResults()}
  else if(id==="cfgName"){setCfg("name",e.target.value.trim()||DEFAULTS.name)}
  else if(id==="cfgInt"||id==="cfgLit"){persistCfg().catch(function(er){toast(errMsg(er))})}
  else if(id==="impFile"){var f=e.target.files[0];if(f)importBackup(f);e.target.value=""}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#overlay").hidden)closePanel()});
window.addEventListener("hashchange",route);

/* ---------- início ---------- */
function mergeCfg(d){
  var older=!d||d.ver!==3;
  cfg=Object.assign({},DEFAULTS,d||{});
  if(older)cfg.font="whimsy";            /* adota o novo visual; dá para trocar em Personalizar */
  cfg.ver=3;
  if(["whimsy","grotesk","mono"].indexOf(cfg.font)<0)cfg.font="whimsy";
  if(["system","light","dark"].indexOf(cfg.theme)<0)cfg.theme="system";
  if(!SIZES[cfg.size])cfg.size="m";
  if(cfg.stars!=="gold")cfg.stars="cover";
  var si=Number(cfg.sInt),sl=Number(cfg.sLit);
  cfg.sInt=isFinite(si)?clamp(Math.round(si),30,130):100;
  cfg.sLit=isFinite(sl)?clamp(Math.round(sl),-20,20):0;
  cfg.accent=cfg.accent==="fixed"?"fixed":"auto";
  var c=cfg.custom;
  if(c&&numIn(c.h,0,360)!=null&&numIn(c.s,0,100)!=null)cfg.custom={h:Number(c.h),s:Number(c.s)};
  else cfg.custom=null;
  if(cfg.accent==="fixed"&&!cfg.custom)cfg.custom={h:numIn(d&&d.hue,0,360)==null?250:Number(d.hue),s:55};
  cfg.name=String(cfg.name||DEFAULTS.name).slice(0,40);
  if(cfg.name==="Discoteca")cfg.name=DEFAULTS.name;
}
async function init(){
  applyConfig();route();
  try{
    idb=await idbOpen();
    var all=await idbReq("albums","readonly",function(s){return s.getAll()});
    albums=(all||[]).map(function(d){return normAlbum(String(d.id),d)});
    var kv=await idbReq("kv","readonly",function(s){return s.get("cfg")});
    mergeCfg(kv&&kv.v);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  }catch(e){
    idb=null;memMode=true;
  }
  loaded=true;applyConfig();render();
  upgradePalettes();
}
init();
})();
</script>
